[project]
name = "ai-agent-starter-kit"
version = "0.1.0"
description = "Reusable workspace with agent rules, skills and MCP tools for AI-assisted development"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
api-health-mcp = "mcp_tools.api_health_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_tools"]
